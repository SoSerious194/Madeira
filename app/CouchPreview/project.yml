# Couch mode preview app: runs app/Madeira/CouchMode in the iOS Simulator with
# mock games, without Madeira's engine. Generate the project with
# `xcodegen` in this folder (docs/COUCH_MODE_PLAN.md).
name: CouchPreview
options:
  bundleIdPrefix: dev.madeira
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CouchPreview:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - "*.xcodeproj"
      - path: ../Madeira/CouchMode
        excludes:
          # Couch mode inside Madeira; needs Madeira's models.
          - Live/**
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Couch Preview
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Controllers drive the UI, and their Menu button stays in the app.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.madeira.couchpreview
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
